<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  background: #FFF0F7;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  overflow: hidden;
}

/* ── SVG LOGO — ocupa mitad del ancho ── */
.logo-svg {
  width: 50vw;
  max-width: 240px;
  height: auto;
}

/* ── Animación loop: barras suben una a una, se quedan, bajan juntas, repiten ──
   Ciclo total: 2.4s
   Cada barra sube en el 14% del ciclo (≈0.34s), escalonadas de a 13%.
   Todas sostienen hasta el 72%, bajan al 84%, descansan hasta el 100%.
── */

.b1, .b2, .b3, .b4 {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation-duration: 2.4s;
  animation-timing-function: ease-out;
  animation-iteration-count: infinite;
}

@keyframes loop1 {
  0%   { transform: scaleY(0); }
  14%  { transform: scaleY(1); }
  72%  { transform: scaleY(1); }
  84%  { transform: scaleY(0); }
  100% { transform: scaleY(0); }
}
@keyframes loop2 {
  0%,13%  { transform: scaleY(0); }
  27%     { transform: scaleY(1); }
  72%     { transform: scaleY(1); }
  84%     { transform: scaleY(0); }
  100%    { transform: scaleY(0); }
}
@keyframes loop3 {
  0%,26%  { transform: scaleY(0); }
  40%     { transform: scaleY(1); }
  72%     { transform: scaleY(1); }
  84%     { transform: scaleY(0); }
  100%    { transform: scaleY(0); }
}
@keyframes loop4 {
  0%,39%  { transform: scaleY(0); }
  53%     { transform: scaleY(1); }
  72%     { transform: scaleY(1); }
  84%     { transform: scaleY(0); }
  100%    { transform: scaleY(0); }
}

.b1 { animation-name: loop1; }
.b2 { animation-name: loop2; }
.b3 { animation-name: loop3; }
.b4 { animation-name: loop4; }

/* ── TEXTO ── */
.title {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(17px, 4.8vw, 26px);
  font-weight: 900;
  color: #DB2777;
  letter-spacing: .04em;
  text-transform: uppercase;
  margin-top: 28px;
  animation: fadeUp .5s .9s ease both;
}
.tagline {
  font-size: clamp(13px, 3.5vw, 16px);
  font-weight: 500;
  color: #DF9DBA;
  letter-spacing: .1px;
  margin-top: 20px;
  animation: fadeUp .5s 1.05s ease both;
}


/* ── FALLBACK ── */
.fallback {
  position: fixed;
  bottom: 32px;
  font-size: 12px;
  font-weight: 500;
  color: rgba(219,39,119,.35);
  text-decoration: none;
  opacity: 0;
  animation: fadeUp .4s 2s ease forwards;
  -webkit-tap-highlight-color: transparent;
}
.fallback:active { opacity: .5; }

/* ── KEYFRAMES ── */
@keyframes fadeUp {
  from { opacity:0; transform: translateY(10px); }
  to   { opacity:1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- Logo SVG inline, sin fondo ni recuadro -->
